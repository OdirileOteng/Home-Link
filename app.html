<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Home Link Botswana</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <a href="index.html" class="logo" style="color:#fff;text-decoration:none"><i></i>Home Link Botswana</a>
  <div id="who"></div><nav hidden>
    <button data-r="tenant" aria-pressed="true">Tenant</button>
    <button data-r="provider" aria-pressed="false">Provider</button>
    <button data-r="admin" aria-pressed="false">Administrator</button>
  </nav>
</header>
<main id="app"></main>
<dialog id="dlg"></dialog>
<div id="toast" role="status"></div>
<script src="auth.js"></script>
<script>
const ME=A.me();if(!ME){location.replace("login.html");throw 0}
const LOC=["Gaborone – Phakalane","Gaborone – Block 8","Gaborone – Broadhurst","Francistown – Phase 4","Palapye – Central","Maun – Sexaxa"];
const TYPES=["Room","Flat","House"];
const PROV={1:{name:"Mpho Dikgang",ver:"verified"},2:{name:"Lesedi Agents",ver:"pending"}};
const COL=["#2a6aa8","#1f5a7a","#4a7fb0","#33607e","#5b8fc0","#27567f"];
let S={role:ME.role,prov:ME.pid||1,saved:new Set([2]),f:{loc:"",max:"",type:"",savedOnly:false},
L:[
{id:1,t:"Two-bedroom flat near the mall",type:1,loc:0,rent:6500,bed:2,am:"Secure parking, borehole water",d:"Quiet complex with a shared garden, ten minutes from the main shopping area.",p:1,st:"approved",av:"available",log:[]},
{id:2,t:"Furnished room in a family home",type:0,loc:1,rent:1800,bed:1,am:"Wi-Fi, prepaid electricity",d:"Private entrance and shared kitchen. Suits a student or young professional.",p:1,st:"approved",av:"available",log:[]},
{id:3,t:"Three-bedroom house with yard",type:2,loc:2,rent:9800,bed:3,am:"Fenced yard, garage, solar geyser",d:"Family house on a tarred road with a small lawn and a covered patio.",p:1,st:"approved",av:"rented",log:[{o:"available",n:"rented",u:"Mpho Dikgang",w:"3 Oct 2026"}]},
{id:4,t:"One-bedroom flat, ground floor",type:1,loc:3,rent:3200,bed:1,am:"Prepaid water, walled compound",d:"Compact flat close to the taxi rank and schools.",p:1,st:"approved",av:"available",log:[]},
{id:5,t:"Lodge-style cottage",type:2,loc:4,rent:4200,bed:2,am:"Air-conditioning, secure gate",d:"Detached cottage in a quiet street, suitable for a couple.",p:1,st:"approved",av:"available",log:[]},
{id:6,t:"Riverside studio",type:1,loc:5,rent:2900,bed:1,am:"Shaded parking, Wi-Fi ready",d:"Self-contained studio, short walk to the river.",p:1,st:"pending",av:"available",log:[]}],
V:[{id:1,l:6,t:"Tenant A. Sample",msg:"Hoping to view on Saturday.",when:"Sat 24 Oct, 10:00",st:"pending",by:"tenant@homelink.test"}],
nid:10};
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const toast=m=>{const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove("on"),2400)};
const bwp=n=>"P"+Number(n).toLocaleString("en-US");
const pub=l=>l.st==="approved"&&PROV[l.p].ver==="verified";
const avTag=a=>`<span class="tag ${a==="available"?"ok":a==="rented"?"bad":"warn"}">${a[0].toUpperCase()+a.slice(1)}</span>`;
const stTag=s=>`<span class="tag ${s==="approved"||s==="verified"||s==="accepted"?"ok":s==="rejected"||s==="declined"?"bad":"warn"}">${s[0].toUpperCase()+s.slice(1)}</span>`;
const ver=()=>`<span class="tag ok">✓ Verified provider</span>`;
const opts=(a,v)=>a.map((x,i)=>`<option value="${i}"${String(v)===String(i)?" selected":""}>${x}</option>`).join("");

function card(l){
 const fav=S.saved.has(l.id);
 return `<article class="card"><div class="ph" style="background:${COL[l.id%6]}">${TYPES[l.type]} · ${l.bed} bed</div><div class="cb">
 <h3>${esc(l.t)}</h3><div class="rent">${bwp(l.rent)} <span class="muted">/ month</span></div>
 <div class="muted">${LOC[l.loc]}</div><div class="row">${ver()}${avTag(l.av)}</div>
 <div class="sp"><button class="btn" data-a="open" data-id="${l.id}">View details</button>
 <button class="btn alt" data-a="fav" data-id="${l.id}" aria-pressed="${fav}">${fav?"Saved":"Save"}</button></div></div></article>`}

function tenant(){
 const f=S.f;
 let r=S.L.filter(l=>pub(l)&&l.av==="available"&&(f.loc===""||l.loc==f.loc)&&(f.type===""||l.type==f.type)&&(!f.max||l.rent<=+f.max)&&(!f.savedOnly||S.saved.has(l.id)));
 const mine=S.V.filter(v=>v.by===ME.email);
 return `<section class="hero"><h1>Find a rental you can trust.</h1><p>Every listing here comes from a verified provider and has been approved by an administrator. Rented homes are hidden from search.</p></section>
 <div class="filters"><div><label for="fl">Location</label><select id="fl"><option value="">Anywhere</option>${opts(LOC,f.loc)}</select></div>
 <div><label for="ft">Property type</label><select id="ft"><option value="">Any</option>${opts(TYPES,f.type)}</select></div>
 <div><label for="fm">Max rent (P per month)</label><input id="fm" type="number" min="0" step="100" value="${f.max}" placeholder="e.g. 5000"></div>
 <div><label for="fs">Show</label><select id="fs"><option value="">All listings</option><option value="1"${f.savedOnly?" selected":""}>Saved only</option></select></div></div>
 ${r.length?`<div class="grid">${r.map(card).join("")}</div>`:`<div class="empty">No listings match these filters. Widen the price range or choose another location.</div>`}
 <div class="panel" style="margin-top:24px"><h2>My viewing requests</h2>${mine.length?mine.map(v=>{const l=S.L.find(x=>x.id===v.id);return `<div class="item"><div><strong>${esc(l.t)}</strong><div class="muted">${esc(v.when)}</div></div>${stTag(v.st)}</div>`}).join(""):`<p class="muted">You haven’t requested a viewing yet. Open a listing and choose Request viewing.</p>`}</div>`}

function provider(){
 const p=PROV[S.prov],mine=S.L.filter(l=>l.p===S.prov),vr=S.V.filter(v=>mine.some(l=>l.id===v.id));
 return `<section class="hero"><h1>Manage your listings.</h1><p>Keep availability current so tenants only enquire about homes you can still let.</p></section>
 <div class="panel"><div class="row"><strong>${esc(p.name)}</strong>${stTag(p.ver)}</div>
 ${p.ver!=="verified"?`<p class="muted">Your identity verification is pending. You can’t submit listings until an administrator approves it.</p>`:""}
 <button class="btn" data-a="new" style="margin-top:10px">Add a listing</button></div>
 <div class="panel"><h2>Your listings</h2>${mine.length?mine.map(l=>`<div class="item"><div><strong>${esc(l.t)}</strong><div class="muted">${LOC[l.loc]} · ${bwp(l.rent)} / month</div><div class="row" style="margin-top:4px">${stTag(l.st)}${avTag(l.av)}</div></div>
 ${l.st==="approved"?`<div><label for="av${l.id}">Availability</label><select id="av${l.id}" data-a="av" data-id="${l.id}">${["available","rented","unavailable"].map(a=>`<option${a===l.av?" selected":""}>${a}</option>`).join("")}</select></div>`:""}</div>${l.log.length?`<div class="muted">Last change: ${l.log[l.log.length-1].o} → ${l.log[l.log.length-1].n} by ${esc(l.log[l.log.length-1].u)}, ${l.log[l.log.length-1].w}</div>`:""}`).join(""):`<p class="muted">No listings yet.</p>`}</div>
 <div class="panel"><h2>Viewing requests</h2>${vr.length?vr.map(v=>{const l=S.L.find(x=>x.id===v.id);return `<div class="item"><div><strong>${esc(l.t)}</strong><div class="muted">${esc(v.t)} · ${esc(v.when)}</div><div>${esc(v.msg)}</div></div>${v.st==="pending"?`<div class="row"><button class="btn" data-a="vr" data-id="${S.V.indexOf(v)}" data-v="accepted">Accept</button><button class="btn alt" data-a="vr" data-id="${S.V.indexOf(v)}" data-v="declined">Decline</button></div>`:stTag(v.st)}</div>`}).join(""):`<p class="muted">No requests yet.</p>`}</div>`}

function admin(){
 const pp=Object.entries(PROV).filter(([,p])=>p.ver==="pending"),pl=S.L.filter(l=>l.st==="pending");
 const n=k=>S.L.filter(l=>l.st===k).length;
 return `<section class="hero"><h1>Review and approve.</h1><p>Nothing goes public until a verified provider’s listing is approved here.</p></section>
 <div class="grid" style="margin-bottom:16px"><div class="panel"><h3>${pp.length}</h3><span class="muted">providers awaiting verification</span></div><div class="panel"><h3>${pl.length}</h3><span class="muted">listings awaiting approval</span></div><div class="panel"><h3>${n("approved")}</h3><span class="muted">approved listings</span></div></div>
 <div class="panel"><h2>Provider verification</h2>${pp.length?pp.map(([id,p])=>`<div class="item"><div><strong>${esc(p.name)}</strong><div class="muted">Identity document submitted</div></div><div class="row"><button class="btn" data-a="pv" data-id="${id}" data-v="verified">Approve</button><button class="btn red" data-a="pv" data-id="${id}" data-v="rejected">Reject</button></div></div>`).join(""):`<p class="muted">Nothing to review.</p>`}</div>
 <div class="panel"><h2>Listing approval</h2>${pl.length?pl.map(l=>`<div class="item"><div><strong>${esc(l.t)}</strong><div class="muted">${esc(PROV[l.p].name)} · ${LOC[l.loc]} · ${bwp(l.rent)} · authority-to-let attached</div>${PROV[l.p].ver!=="verified"?`<div class="muted">Provider not yet verified.</div>`:""}</div><div class="row"><button class="btn" data-a="la" data-id="${l.id}" data-v="approved">Approve</button><button class="btn red" data-a="la" data-id="${l.id}" data-v="rejected">Reject</button></div></div>`).join(""):`<p class="muted">Nothing to review.</p>`}</div>`}

function render(){
 $("#who").innerHTML=`<span>${esc(ME.name)} (${ME.role})</span><button class="btn alt" data-a="out" style="color:#fff;border-color:#fff6">Log out</button>`;
 $("#app").innerHTML={tenant,provider,admin}[S.role]();persist();
}
function modal(h){const d=$("#dlg");d.innerHTML=h;d.showModal()}
function detail(id){
 const l=S.L.find(x=>x.id===id);
 modal(`<h2>${esc(l.t)}</h2><div class="rent">${bwp(l.rent)} <span class="muted">/ month</span></div>
 <p class="muted">${LOC[l.loc]} · ${TYPES[l.type]} · ${l.bed} bedroom${l.bed>1?"s":""}</p><div class="row">${ver()}${avTag(l.av)}</div>
 <p>${esc(l.d)}</p><p><strong>Amenities:</strong> ${esc(l.am)}</p>
 <div class="f"><div><label for="vd">Preferred date and time</label><input id="vd" type="datetime-local"></div><div><label for="vm">Message to provider</label><textarea id="vm" rows="3" placeholder="Introduce yourself and ask any questions"></textarea></div></div>
 <div class="row" style="margin-top:14px"><button class="btn" data-a="send" data-id="${id}">Request viewing</button><button class="btn alt" data-a="close">Close</button></div>`)}
function newForm(){
 if(PROV[S.prov].ver!=="verified")return toast("Verify your identity before adding listings.");
 modal(`<h2>Add a listing</h2><div class="f"><div><label for="nt">Title</label><input id="nt"></div>
 <div><label for="nl">Location</label><select id="nl">${opts(LOC)}</select></div><div><label for="ny">Property type</label><select id="ny">${opts(TYPES)}</select></div>
 <div><label for="nr">Monthly rent (P)</label><input id="nr" type="number" min="1"></div><div><label for="nd">Description</label><textarea id="nd" rows="3"></textarea></div>
 <div><label for="na">Authority-to-let document</label><input id="na" type="file"></div></div>
 <div class="row" style="margin-top:14px"><button class="btn" data-a="add">Submit for approval</button><button class="btn alt" data-a="close">Cancel</button></div>`)}

document.addEventListener("click",e=>{
 const b=e.target.closest("button");if(!b)return;
 if(b.dataset.a==="out")return A.out();
 const a=b.dataset.a,id=+b.dataset.id,v=b.dataset.v;
 if(a==="close")$("#dlg").close();
 else if(a==="open")detail(id);
 else if(a==="fav"){S.saved.has(id)?S.saved.delete(id):S.saved.add(id);render()}
 else if(a==="new")newForm();
 else if(a==="send"){const d=$("#vd").value;if(!d)return toast("Choose a preferred date and time.");S.V.push({id,t:"You",msg:$("#vm").value||"No message.",when:new Date(d).toLocaleString("en-GB",{dateStyle:"medium",timeStyle:"short"}),st:"pending",by:ME.email});$("#dlg").close();toast("Viewing requested. The provider has been notified.");render()}
 else if(a==="add"){const t=$("#nt").value.trim(),r=+$("#nr").value;if(!t||r<=0)return toast("Enter a title and a rent above zero.");if(!$("#na").files.length)return toast("Attach an authority-to-let document.");S.L.push({id:S.nid++,t,type:+$("#ny").value,loc:+$("#nl").value,rent:r,bed:1,am:"To be confirmed",d:$("#nd").value||"No description yet.",p:S.prov,st:"pending",av:"available",log:[]});$("#dlg").close();toast("Submitted. An administrator will review it.");render()}
 else if(a==="vr"){S.V[id].st=v;toast(v==="accepted"?"Accepted. The tenant has been notified.":"Declined. The tenant has been notified.");render()}
 else if(a==="pv"){PROV[id].ver=v;toast(v==="verified"?"Provider verified.":"Provider rejected.");render()}
 else if(a==="la"){const l=S.L.find(x=>x.id===id);l.st=v;toast(v==="approved"?(PROV[l.p].ver==="verified"?"Listing approved and now public.":"Approved, but it stays hidden until the provider is verified."):"Listing rejected.");render()}
});
document.addEventListener("change",e=>{
 const t=e.target;
 if(t.id==="fl"){S.f.loc=t.value;render()}else if(t.id==="ft"){S.f.type=t.value;render()}else if(t.id==="fm"){S.f.max=t.value;render()}else if(t.id==="fs"){S.f.savedOnly=!!t.value;render()}
 else if(t.id==="pp"){S.prov=+t.value;render()}
 else if(t.dataset.a==="av"){const l=S.L.find(x=>x.id===+t.dataset.id);if(l.av!==t.value){l.log.push({o:l.av,n:t.value,u:PROV[S.prov].name,w:new Date().toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"})});l.av=t.value;if(t.value!=="available")S.V.forEach(v=>{if(v.id===l.id&&v.st==="pending")v.st="declined"});toast("Availability updated and logged.");render()}}
});
function persist(){try{localStorage.setItem("hl_state",JSON.stringify({L:S.L,V:S.V,nid:S.nid,saved:[...S.saved],PROV}))}catch{}}
function load(){try{const j=JSON.parse(localStorage.getItem("hl_state"));if(j){S.L=j.L;S.V=j.V;S.nid=j.nid;S.saved=new Set(j.saved);for(const k in PROV)delete PROV[k];Object.assign(PROV,j.PROV)}}catch{}}
load();if(S.role==="provider"&&!PROV[S.prov])PROV[S.prov]={name:ME.name,ver:"pending"};
render();
</script>
</body>
</html>
